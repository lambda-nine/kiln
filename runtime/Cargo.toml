[package]
name = "kiln"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small Linux sandbox runtime for AI agent tools"
license = "Apache-2.0"
repository = "https://github.com/lambda-nine/kiln"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
nix = { version = "0.31.3", features = ["sched", "mount", "hostname", "process", "signal", "fs", "ioctl", "user"] }
